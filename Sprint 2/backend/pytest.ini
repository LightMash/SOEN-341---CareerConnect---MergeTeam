# Configuration for pytest. Run it from this folder (Sprint 2/backend) with:  pytest -v
[pytest]
# Only look for tests inside the tests/ folder.
testpaths = tests

# Put this folder on the import path so tests can write `from app import app`
# and `import security` exactly like the real code does.
pythonpath = .

# -ra = at the end, print a short summary of anything skipped or failed.
addopts = -ra

# The existing code uses datetime.utcnow(), which newer Python versions flag as
# deprecated. It works fine, so hide that noise to keep test output readable.
filterwarnings =
    ignore::DeprecationWarning
